<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba879" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="450" rx="24" fill="url(#avatarBg)" />
  
  <!-- Decorative Circles in Background -->
  <circle cx="90" cy="100" r="45" fill="#f472b6" opacity="0.2" />
  <circle cx="330" cy="140" r="60" fill="#818cf8" opacity="0.25" />
  <circle cx="200" cy="220" r="140" fill="#ffffff" opacity="0.6" />

  <!-- Designer Headset / Hair Back -->
  <path d="M 120 180 C 120 90, 280 90, 280 180 C 280 270, 270 300, 260 320 L 140 320 C 130 300, 120 270, 120 180 Z" fill="url(#hairGrad)" />

  <!-- Shoulders & Outfit -->
  <path d="M 80 450 C 90 350, 130 320, 200 320 C 270 320, 310 350, 320 450 Z" fill="url(#shirtGrad)" filter="url(#softGlow)" />
  
  <!-- Collar / Necklace -->
  <path d="M 175 320 Q 200 355 225 320 Z" fill="url(#skinGrad)" />
  <circle cx="200" cy="340" r="4" fill="#fbbf24" />

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="70" rx="8" fill="url(#skinGrad)" />

  <!-- Face -->
  <ellipse cx="200" cy="205" rx="58" ry="68" fill="url(#skinGrad)" />

  <!-- Hair Front / Bangs -->
  <path d="M 142 180 C 145 130, 255 130, 258 180 C 240 160, 220 170, 200 155 C 180 170, 160 160, 142 180 Z" fill="url(#hairGrad)" />
  <!-- Hair Strands Framing Face -->
  <path d="M 142 175 C 138 210, 145 250, 150 270 C 144 240, 144 200, 145 175 Z" fill="url(#hairGrad)" />
  <path d="M 258 175 C 262 210, 255 250, 250 270 C 256 240, 256 200, 255 175 Z" fill="url(#hairGrad)" />

  <!-- Chic Eyeglasses (Designer Vibe) -->
  <g stroke="#3730a3" stroke-width="3" fill="none">
    <rect x="156" y="185" width="36" height="28" rx="8" fill="#ffffff" fill-opacity="0.3" />
    <rect x="208" y="185" width="36" height="28" rx="8" fill="#ffffff" fill-opacity="0.3" />
    <path d="M 192 195 Q 200 190 208 195" />
    <line x1="145" y1="193" x2="156" y2="195" />
    <line x1="244" y1="195" x2="255" y2="193" />
  </g>

  <!-- Eyes behind glasses -->
  <ellipse cx="174" cy="198" rx="4" ry="5" fill="#1e1b4b" />
  <ellipse cx="226" cy="198" rx="4" ry="5" fill="#1e1b4b" />
  <circle cx="172" cy="196" r="1.5" fill="#ffffff" />
  <circle cx="224" cy="196" r="1.5" fill="#ffffff" />

  <!-- Cheerful Smile & Blush -->
  <ellipse cx="160" cy="216" rx="8" ry="4" fill="#f43f5e" opacity="0.35" />
  <ellipse cx="240" cy="216" rx="8" ry="4" fill="#f43f5e" opacity="0.35" />
  <path d="M 188 232 Q 200 244 212 232" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Badge Pill at Bottom -->
  <g filter="url(#softGlow)" transform="translate(110, 395)">
    <rect width="180" height="38" rx="19" fill="#ffffff" />
    <circle cx="24" cy="19" r="6" fill="#10b981" />
    <text x="38" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e1b4b">Kyla Dael • Designer</text>
  </g>
</svg>