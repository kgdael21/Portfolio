<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="p2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#831843" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p2Grad)" />

  <!-- Social Media Post Card Mockup 1 -->
  <g filter="url(#p2Shadow)" transform="translate(70, 70)">
    <rect width="210" height="260" rx="16" fill="#ffffff" />
    <!-- Header -->
    <circle cx="28" cy="28" r="14" fill="#f43f5e" />
    <text x="28" y="33" font-size="12" text-anchor="middle" fill="#fff">✨</text>
    <text x="50" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">lumina_glow</text>
    <text x="50" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Sponsored</text>
    <!-- Visual Image Area -->
    <rect x="15" y="52" width="180" height="135" rx="10" fill="#ffe4e6" />
    <circle cx="105" cy="110" r="40" fill="#f43f5e" opacity="0.3" />
    <rect x="85" y="80" width="40" height="60" rx="8" fill="#fda4af" />
    <text x="105" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#be123c" text-anchor="middle">NEW GLOW SERUM</text>
    <!-- Engagement Bar -->
    <circle cx="28" cy="206" r="6" fill="#f43f5e" />
    <circle cx="48" cy="206" r="6" fill="#cbd5e1" />
    <circle cx="68" cy="206" r="6" fill="#cbd5e1" />
    <rect x="15" y="222" width="120" height="6" rx="3" fill="#cbd5e1" />
    <rect x="15" y="235" width="80" height="5" rx="2.5" fill="#e2e8f0" />
  </g>

  <!-- Social Media Carousel Slide Mockup 2 (Behind/Tilted) -->
  <g filter="url(#p2Shadow)" transform="translate(320, 60)">
    <rect width="210" height="260" rx="16" fill="#1e1b4b" />
    <rect x="15" y="20" width="180" height="170" rx="12" fill="#312e81" />
    <circle cx="105" cy="90" r="35" fill="#ec4899" opacity="0.4" />
    <text x="105" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">5 TIPS FOR</text>
    <text x="105" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#f472b6" text-anchor="middle">RADIANT SKIN</text>
    <rect x="35" y="125" width="140" height="6" rx="3" fill="#6366f1" />
    <rect x="50" y="140" width="110" height="5" rx="2.5" fill="#818cf8" />
    <!-- Swipe indicator -->
    <rect x="75" y="215" width="60" height="24" rx="12" fill="#ec4899" />
    <text x="105" y="231" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Swipe ➔</text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="25" width="170" height="32" rx="16" fill="#ffffff" />
  <text x="115" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">Social Media Campaign</text>
</svg>