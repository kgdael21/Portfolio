<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background decorative canvas -->
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)" />
  
  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    
    <line x1="0" y1="50" x2="500" y2="500" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="350" x2="500" y2="350" />
    <line x1="0" y1="400" x2="500" y2="400" />
    <line x1="0" y1="450" x2="500" y2="450" />
  </g>

  <!-- Central Graphic Design Workspace Mockup -->
  <rect x="75" y="70" width="350" height="260" rx="16" fill="url(#cardGrad)" filter="url(#shadow)" />
  
  <!-- Window Header -->
  <rect x="75" y="70" width="350" height="38" rx="16" fill="#1e1b4b" />
  <rect x="75" y="92" width="350" height="16" fill="#1e1b4b" />
  <circle cx="102" cy="89" r="6" fill="#ef4444" />
  <circle cx="122" cy="89" r="6" fill="#f59e0b" />
  <circle cx="142" cy="89" r="6" fill="#10b981" />
  <text x="250" y="93" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">kyla_project_canvas.fig</text>

  <!-- Canvas Content -->
  <!-- Color Palette Swatches -->
  <circle cx="120" cy="150" r="18" fill="#ec4899" />
  <circle cx="165" cy="150" r="18" fill="#8b5cf6" />
  <circle cx="210" cy="150" r="18" fill="#06b6d4" />
  <circle cx="255" cy="150" r="18" fill="#10b981" />

  <!-- Pen Tool Vector Shape -->
  <path d="M 120 260 C 180 180, 260 290, 340 180" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
  <circle cx="120" cy="260" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="4" />
  <circle cx="230" cy="235" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="4" />
  <circle cx="340" cy="180" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="4" />

  <!-- Vector Pen Icon Floating -->
  <g transform="translate(320, 150) rotate(-45)">
    <path d="M0,0 L16,4 L12,20 Z" fill="#3b82f6" />
    <path d="M12,20 L40,65 L30,75 L2,28 Z" fill="#1e293b" />
    <circle cx="20" cy="45" r="4" fill="#ffffff" />
  </g>

  <!-- Floating Badge 1: Graphic Design -->
  <g filter="url(#shadow)" transform="translate(45, 345)">
    <rect width="180" height="64" rx="14" fill="#ffffff" />
    <circle cx="36" cy="32" r="18" fill="#fdf2f8" />
    <text x="36" y="38" font-size="20" text-anchor="middle">🎨</text>
    <text x="68" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Graphic Artist</text>
    <text x="68" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b">Visual Storyteller</text>
  </g>

  <!-- Floating Badge 2: Tools -->
  <g filter="url(#shadow)" transform="translate(265, 360)">
    <rect width="190" height="68" rx="14" fill="#0f172a" />
    <circle cx="36" cy="34" r="18" fill="#1e293b" />
    <text x="36" y="40" font-size="18" text-anchor="middle">✨</text>
    <text x="68" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Creative Suite</text>
    <text x="68" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#38bdf8">Canva • Figma • Adobe</text>
  </g>

  <!-- Sparkles -->
  <path d="M 430 80 Q 440 90 450 90 Q 440 90 430 100 Q 430 90 420 90 Q 430 90 430 80 Z" fill="#facc15" />
  <path d="M 70 240 Q 78 248 86 248 Q 78 248 70 256 Q 70 248 62 248 Q 70 248 70 240 Z" fill="#ffffff" opacity="0.8" />
  <path d="M 390 310 Q 396 316 402 316 Q 396 316 390 322 Q 390 316 384 316 Q 390 316 390 310 Z" fill="#f43f5e" />
</svg>