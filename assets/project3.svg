<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p3Grad)" />

  <!-- Mobile Phone Mockup -->
  <g filter="url(#p3Shadow)" transform="translate(200, 30)">
    <!-- Device Frame -->
    <rect width="200" height="340" rx="30" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker -->
    <rect x="70" y="10" width="60" height="10" rx="5" fill="#000000" />
    <!-- Screen Area -->
    <rect x="8" y="26" width="184" height="304" rx="22" fill="#ffffff" />
    
    <!-- App UI: Bloom Task Tracker -->
    <!-- App Header -->
    <circle cx="28" cy="50" r="12" fill="#e0e7ff" />
    <text x="28" y="54" font-size="10" text-anchor="middle">🌸</text>
    <text x="48" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e1b4b">Bloom Habits</text>
    <circle cx="172" cy="50" r="10" fill="#f1f5f9" />
    
    <!-- Progress Ring Card -->
    <rect x="18" y="70" width="164" height="85" rx="14" fill="#6366f1" />
    <circle cx="55" cy="112" r="26" fill="none" stroke="#818cf8" stroke-width="6" />
    <circle cx="55" cy="112" r="26" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="120" stroke-dashoffset="30" />
    <text x="55" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">75%</text>
    <text x="96" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Daily Goals</text>
    <text x="96" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c7d2fe">6 of 8 tasks done</text>

    <!-- Task List Items -->
    <rect x="18" y="168" width="164" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="34" cy="185" r="7" fill="#10b981" />
    <text x="50" y="189" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">Drink 2L Water</text>

    <rect x="18" y="210" width="164" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="34" cy="227" r="7" fill="#6366f1" />
    <text x="50" y="231" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">Design Wireframes</text>

    <rect x="18" y="252" width="164" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="34" cy="269" r="7" fill="#cbd5e1" />
    <text x="50" y="273" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b">CapCut Video Edit</text>

    <!-- Bottom Nav -->
    <rect x="8" y="296" width="184" height="34" rx="16" fill="#ffffff" />
    <circle cx="50" cy="312" r="6" fill="#6366f1" />
    <circle cx="100" cy="312" r="6" fill="#cbd5e1" />
    <circle cx="150" cy="312" r="6" fill="#cbd5e1" />
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="25" width="150" height="32" rx="16" fill="#ffffff" />
  <text x="105" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">UI/UX Concept</text>
</svg>