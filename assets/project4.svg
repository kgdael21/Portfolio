<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="p4Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p4Grad)" />

  <!-- Magazine Spread Open Mockup -->
  <g filter="url(#p4Shadow)" transform="translate(90, 60)">
    <!-- Left Page -->
    <rect x="0" y="0" width="205" height="280" fill="#fdfbf7" rx="4" />
    <!-- Big Editorial Headline -->
    <text x="25" y="48" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0f172a">VOGUE</text>
    <text x="25" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#64748b">ECHO ISSUE 14</text>
    <line x1="25" y1="74" x2="180" y2="74" stroke="#0f172a" stroke-width="1.5" />
    <!-- Feature Image on Left Page -->
    <rect x="25" y="86" width="155" height="110" fill="#e2e8f0" />
    <circle cx="102" cy="141" r="30" fill="#f43f5e" opacity="0.6" />
    <path d="M 50 180 L 100 120 L 140 160 L 170 110 L 180 180 Z" fill="#475569" opacity="0.3" />
    <rect x="25" y="210" width="155" height="4" fill="#334155" />
    <rect x="25" y="220" width="130" height="4" fill="#64748b" />
    <rect x="25" y="230" width="140" height="4" fill="#94a3b8" />
    <rect x="25" y="240" width="90" height="4" fill="#cbd5e1" />

    <!-- Spine shadow -->
    <rect x="202" y="0" width="6" height="280" fill="#000000" opacity="0.25" />

    <!-- Right Page -->
    <rect x="208" y="0" width="205" height="280" fill="#ffffff" rx="4" />
    <!-- Two Column Columns -->
    <rect x="228" y="35" width="75" height="130" fill="#0284c7" rx="3" />
    <circle cx="265" cy="90" r="22" fill="#bae6fd" />
    
    <text x="228" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0f172a">MINIMALISM</text>
    <rect x="228" y="195" width="75" height="3" fill="#64748b" />
    <rect x="228" y="202" width="70" height="3" fill="#94a3b8" />
    <rect x="228" y="209" width="75" height="3" fill="#94a3b8" />
    <rect x="228" y="216" width="60" height="3" fill="#cbd5e1" />

    <text x="318" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0f172a">THE ESSENCE</text>
    <rect x="318" y="55" width="75" height="3" fill="#64748b" />
    <rect x="318" y="62" width="70" height="3" fill="#94a3b8" />
    <rect x="318" y="69" width="75" height="3" fill="#94a3b8" />
    <rect x="318" y="76" width="65" height="3" fill="#cbd5e1" />
    <rect x="318" y="83" width="70" height="3" fill="#cbd5e1" />

    <rect x="318" y="105" width="75" height="120" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
    <text x="355" y="170" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" fill="#0284c7" text-anchor="middle">&amp;</text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="25" width="160" height="32" rx="16" fill="#ffffff" />
  <text x="110" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Editorial &amp; Print</text>
</svg>